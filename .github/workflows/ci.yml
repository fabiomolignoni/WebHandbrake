name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run i18n
      - run: npm test
      - run: npm run build
      - run: npx web-ext lint --source-dir dist/firefox --warnings-as-errors=false

  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        if: matrix.browser == 'chromium'
        run: npx playwright install --with-deps chromium
      - name: Install Firefox and geckodriver
        if: matrix.browser == 'firefox'
        run: npm run browsers -- --skip-chromium
      - run: npm run test:e2e:${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-${{ matrix.browser }}
          path: |
            test-results
            playwright-report

  package:
    if: github.event_name == 'push'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: web-ext-artifacts/*.zip
