# External links in the documentation, checked once a week and on demand. It never runs on pull
# requests, so an outage of a linked site cannot block a merge. Relative links and anchors are
# checked offline by npm run docs:check. A dead link to Discussions means that the repository's
# Discussions are off. The page for reporting a vulnerability needs a login, so it is skipped.

name: Documentation links

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >-
            --no-progress
            --scheme https
            --scheme http
            --exclude '^https?://([^/]+\.)?(test|invalid)([:/]|$)'
            --exclude '^https?://(localhost|127\.0\.0\.1)([:/]|$)'
            --exclude '/security/advisories/new$'
            --exclude-path node_modules
            './**/*.md'
            src/shared/links.ts
