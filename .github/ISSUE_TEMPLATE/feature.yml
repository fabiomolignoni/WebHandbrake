name: Feature request
description: Suggest an improvement (larger ideas fit better in Discussions)
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
  - type: input
    id: requirement
    attributes:
      label: Related requirement IDs (if any)
      placeholder: e.g. LIM-07, ELM-01
